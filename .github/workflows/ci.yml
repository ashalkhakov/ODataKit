name: CI

# Ported from FreeCoreData's and XFormsKit's CI.
#
# pull_request fires for a PR against any branch, and uses the workflow file
# from the PR's own head -- so a branch can run CI through a PR before this
# file has ever existed on master.
#
# workflow_dispatch is the opposite: GitHub only offers the "Run workflow"
# button for workflows present on the repository's DEFAULT branch.
on:
  push:
  pull_request:
  workflow_dispatch:

# A run that lands while an earlier one is still going supersedes it.
#
# The key is the branch NAME rather than the ref, so that a push and the pull
# request for the same branch share one group: pushing to a branch with an
# open PR would otherwise start two nearly identical runs, and on a private
# repository the macOS half of each bills at 10x.
# Attaching packages to a release on a v* tag writes to the repository.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ########################### macOS / Cocoa ###########################
  # On a Mac the Core Data is Apple's, so the same suite that checks the
  # store on GNUstep is checked against the implementation FreeCoreData is a
  # port of. A test that is red here and green on GNUstep is wrong about Core
  # Data.
  #
  # macOS minutes bill at 10x on a private repository. Adding
  #   if: github.event_name != 'push' || github.ref == 'refs/heads/master'
  # confines this job to pull requests and the default branch.
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Unit tests (against Apple's CoreData)
        run: |
          xcodebuild -workspace ODataKit.xcworkspace \
            -scheme ODataKitTests \
            -destination 'platform=macOS' -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ODataKitTests.xcresult" test

      # The server's HTTP adapter over a real loopback socket: the vendored
      # GCDWebServer's own smoke test, then HTTPServerKit and the service
      # behind it (Server/Tests/ois-serve-check.m). Plain clang, no Xcode
      # project.
      - name: HTTP adapter over loopback
        run: |
          make -C ThirdParty/GCDWebServer check
          make -C Server check

      - name: Build the example apps
        run: |
          for scheme in Catalog Workbench; do
            xcodebuild -workspace ODataKit.xcworkspace -scheme "$scheme" \
              -destination 'platform=macOS' -configuration Debug \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" build
          done
          # The libraries for iOS, and the Device app over them (unsigned:
          # the simulator's).
          xcodebuild -workspace ODataKit.xcworkspace -scheme Device \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" build

      # The snapshots check what the store sends; this checks that real
      # services agree: Microsoft's public Northwind v4 (read) and TripPin
      # (write, in a session of its own). They are not ours, so a failure
      # here is reported, not fatal.
      - name: Live service checks (Northwind, TripPin, generated models and classes)
        continue-on-error: true
        run: |
          # The client and the core it sits on, compiled straight in.
          inc="-ISource/ODataKit/include -ISource/ODataKit/include/ODataKit -ISource/ODataIncrementalStore/include -ISource/ODataIncrementalStore/include/ODataIncrementalStore"
          client="Source/ODataKit/*.m Source/ODataIncrementalStore/*.m"
          xcrun momc Examples/Catalog/Catalog.xcdatamodeld "$RUNNER_TEMP/Catalog.momd"
          xcrun momc Tests/Live/TripPin.xcdatamodeld "$RUNNER_TEMP/TripPin.momd"
          xcrun momc Tests/Live/Northwind.xcdatamodeld "$RUNNER_TEMP/Northwind.momd"
          clang -fobjc-arc -fmodules $inc $client Tools/ois-model.m \
            -framework Foundation -framework CoreData -o "$RUNNER_TEMP/ois-model"
          "$RUNNER_TEMP/ois-model" https://services.odata.org/V4/Northwind/Northwind.svc/ "$RUNNER_TEMP/NorthwindGenerated.xcdatamodeld"
          xcrun momc "$RUNNER_TEMP/NorthwindGenerated.xcdatamodeld" "$RUNNER_TEMP/NorthwindGenerated.momd"
          clang -fobjc-arc -fmodules $inc $client Tests/Live/ois-live.m \
            -framework Foundation -framework CoreData -o "$RUNNER_TEMP/ois-live"
          "$RUNNER_TEMP/ois-live" "$RUNNER_TEMP"
          # TripPin's classes, generated and compiled into a client that
          # calls the service's operations as their methods.
          "$RUNNER_TEMP/ois-model" --classes "$RUNNER_TEMP/TripPinClasses" \
            https://services.odata.org/V4/TripPinServiceRW/ "$RUNNER_TEMP/Generated/TripPin.xcdatamodeld"
          xcrun momc "$RUNNER_TEMP/Generated/TripPin.xcdatamodeld" "$RUNNER_TEMP/TripPinGenerated.momd"
          clang -fobjc-arc -fmodules $inc -I"$RUNNER_TEMP/TripPinClasses" \
            $client "$RUNNER_TEMP"/TripPinClasses/*.m Tests/Live/ois-classes.m \
            -framework Foundation -framework CoreData -o "$RUNNER_TEMP/ois-classes"
          "$RUNNER_TEMP/ois-classes" "$RUNNER_TEMP/TripPinGenerated.momd"

      # The Workbench's window, driven against its built-in service,
      # Northwind and TripPin. Network: reported, not fatal.
      - name: Workbench self-test
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/DerivedData/Build/Products/Debug/Workbench.app/Contents/MacOS/Workbench" --self-test

      # The Workbench as an app, for each push: Release, universal (arm64 and
      # x86_64), the frameworks embedded, signed ad hoc and named -unsigned.
      # It has to start and pass the offline self-test before it is
      # uploaded. The one a release carries is release.yml's, signed with a
      # Developer ID and notarized.
      - name: Package the Workbench app
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-$GITHUB_RUN_NUMBER"
          xcodebuild -workspace ODataKit.xcworkspace -scheme Workbench \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/Release" \
            MARKETING_VERSION="${version%%-*}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          app="$RUNNER_TEMP/Release/Build/Products/Release/Workbench.app"
          for fw in ODataKit ODataIncrementalStore ODataService ODataSync; do
            test -d "$app/Contents/Frameworks/$fw.framework" \
              || { echo "::error::Workbench.app does not embed $fw.framework"; exit 1; }
          done
          lipo "$app/Contents/MacOS/Workbench" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/Workbench" --self-test builtin
          ditto -c -k --keepParent "$app" "ODataWorkbench-macOS-$version-unsigned.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ODataWorkbench-macOS-${{ github.sha }}
          path: ODataWorkbench-macOS-*.zip
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-test-results
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7

  ########################### GNUstep / Linux ###########################
  # The store on GNUstep: a patched stack built by gnustep-patches, with
  # FreeCoreData as the Core Data underneath.
  gnustep:
    name: Ubuntu (GNUstep, FreeCoreData, clang, gnustep-2.0)
    runs-on: ubuntu-latest
    # The stack build is the long pole; everything after it is minutes.
    timeout-minutes: 90
    env:
      SRC_PATH: ${{ github.workspace }}/source
      PREFIX: ${{ github.workspace }}/build
      SOURCES: ${{ github.workspace }}/dependencies
      CC: clang
      CXX: clang++
      LIBRARY_COMBO: ng-gnu-gnu
      RUNTIME_VERSION: gnustep-2.0
      # Foundation for the store, gui and back for the example apps, the Eau
      # theme the Workbench's AppImage ships with (as FreeCoreData's Model
      # Builder does), tools-xctest for the suite.
      COMPONENTS: libobjc2 libdispatch tools-make libs-base libs-gui libs-back eau tools-xctest
      # libobjc2 and libdispatch land in the prefix's plain lib/, which the
      # gnustep layout does not treat as a library root. GNUstep.sh prepends
      # the roots it does know about to this.
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
      # Both pinned to commits, not branches. The patches ref decides the
      # recipe hash the stack is cached under, so a moving branch would keep
      # serving a prefix built from patches that have since changed.
      GNUSTEP_PATCHES_REF: 7539fc686a72250574fff6c17e1c92eb024ddc33
      # FreeCoreData after #43: models can be copied (#43); managed objects
      # and object IDs in predicates match on every store, and count (#41);
      # its momc keeps a model version's Identifier, which models generated
      # from $metadata carry (#40).
      # #51: the SQL backends share one libCDSQLStore, so a process can load
      # both, and evaluate MATCHES in SQL.
      FREECOREDATA_REF: b612b0a90fcae0b0fabcd1ff71442988eb67b518
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source

    # FreeCoreData's SQL backends' servers, for the predicate pair tests:
    # what the service reads from a $filter, run by each store. The same
    # images FreeCoreData's own backends workflow runs against.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: coredata
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: coredata
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: coredata
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: ashalkhakov/gnustep-patches
          ref: ${{ env.GNUSTEP_PATCHES_REF }}
          path: gnustep-patches

      - uses: actions/checkout@v4
        with:
          repository: ashalkhakov/FreeCoreData
          ref: ${{ env.FREECOREDATA_REF }}
          path: FreeCoreData

      - name: Install packages
        run: |
          ./.github/scripts/apt-update.sh
          sudo apt-get -q -y install \
            pkg-config libgnutls28-dev libffi-dev libicu-dev libxml2-dev libxslt1-dev \
            libssl-dev libavahi-client-dev zlib1g-dev gnutls-bin libcurl4-gnutls-dev \
            libgmp-dev libcairo2-dev libjpeg-dev libtiff-dev libpng-dev libicns-dev \
            libpthread-workqueue-dev libsqlite3-dev \
            libfreetype-dev libfontconfig1-dev libxrender-dev \
            libxt-dev libxmu-dev libxft-dev libxrandr-dev libxfixes-dev libxcursor-dev \
            xvfb libpq-dev libmariadb-dev libavahi-compat-libdnssd-dev avahi-daemon
          # xvfb is a display for the Workbench's self-test.
          # libavahi-compat-libdnssd-dev is ODataSync's Bonjour (its peers);
          # avahi-daemon answers it, for the peer discovery test.
          # libpq-dev and libmariadb-dev are FreeCoreData's SQL backends'.
          # libsqlite3-dev is FreeCoreData's: NSSQLitePersistentStore links it.
          # libxml2-dev is what gives gnustep-base the NSXML momc reads models
          # with. The rest is the GNUstep stack's.
          #
          # The gnustep-2.0 runtime needs ld.gold or lld. ld.gold is gone from
          # binutils on newer Ubuntu, so fall back to lld rather than failing
          # on a missing alternative.
          if [ -x /usr/bin/ld.gold ]; then
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.gold 10
          else
            sudo apt-get -q -y install lld
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld 10
          fi
          ld --version | head -1

      # The recipe hash covers the build script, COMPONENTS, the toolchain and
      # every patch, so it changes exactly when the prefix would.
      - name: GNUstep recipe
        id: recipe
        run: echo "hash=$(../gnustep-patches/Scripts/build-gnustep.sh --print-recipe-hash)" >> "$GITHUB_OUTPUT"

      # Restored and saved as two separate steps rather than with the combined
      # action, so the save captures the stack before FreeCoreData or anything
      # of ours is installed into it.
      - name: Restore GNUstep
        id: gnustep-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PREFIX }}
          key: gnustep-${{ runner.os }}-${{ steps.recipe.outputs.hash }}

      - name: Build GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: ../gnustep-patches/Scripts/build-gnustep.sh

      - name: Save GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PREFIX }}
          key: gnustep-${{ runner.os }}-${{ steps.recipe.outputs.hash }}

      # A restored prefix can be wrong in exactly the ways a fresh one can:
      # libdispatch's main-queue hooks, ICU, the backend bundle.
      - name: Verify GNUstep
        if: steps.gnustep-cache.outputs.cache-hit == 'true'
        run: ../gnustep-patches/Scripts/build-gnustep.sh --verify-only

      # The framework, and momc with the coredata-model.make fragment: models
      # are compiled to .momd for FreeCoreData, which does not read the
      # .xcdatamodeld XML at runtime.
      - name: Build and install FreeCoreData
        working-directory: ${{ github.workspace }}/FreeCoreData
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -j"$(nproc)"
          make install
          make -C Tools/momc
          make -C Tools/momc install
          make -C Backends/PostgreSQL
          make -C Backends/MySQL

      # Built first and on its own, so a compile error in the library is
      # reported as that rather than as a test failure.
      - name: Build the libraries
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -j"$(nproc)"

      # The same sources through the sibling Makefile, which needs only
      # clang and gnustep-config, and the README's ois-filter example.
      - name: Build without gnustep-make
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -f Makefile
          got=$(LD_LIBRARY_PATH=".:$LD_LIBRARY_PATH" ./ois-filter 'unitPrice > 20 AND discontinued == NO')
          want='UnitPrice gt 20 and Discontinued eq false'
          [ "$got" = "$want" ] || { echo "::error::ois-filter printed '$got', expected '$want'"; exit 1; }
          make -f Makefile clean

      # Before the suite, so a red test does not hide a compile break here.
      - name: Build the example apps
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -C Examples/Catalog
          make -C Examples/Workbench

      - name: Unit tests
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          sudo systemctl start avahi-daemon || echo "::warning::avahi-daemon did not start: the discovery test is not run"
          AVAHI_COMPAT_NOWARN=1 make test

      # The suite again, with the SQL backends as more stores the predicate
      # pair tests run over: PostgreSQL and MySQL together, then MariaDB
      # through the MySQL backend, whose SQL is not the same as MySQL's.
      - name: Predicates and grouping over PostgreSQL, MySQL and MariaDB
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          backends="FREECOREDATA_BACKENDS=${{ github.workspace }}/FreeCoreData/Backends"
          CD_TEST_POSTGRES_URL=postgresql://postgres:coredata@127.0.0.1:5432/postgres \
          CD_TEST_MYSQL_URL=mysql://root:coredata@127.0.0.1:3306/oistest make -C Tests run-tests "$backends"
          CD_TEST_MYSQL_URL=mysql://root:coredata@127.0.0.1:3307/oistest make -C Tests run-tests "$backends"

      - name: HTTP adapter over loopback
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -C ThirdParty/GCDWebServer check
          make -C Server check

      # As on macOS: real services, reported but not fatal.
      - name: Live service checks (Northwind, TripPin, generated models and classes)
        continue-on-error: true
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -C Tests/Live live

      - name: Workbench self-test
        continue-on-error: true
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          cd Examples/Workbench
          LD_LIBRARY_PATH="$PWD/../../obj${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            xvfb-run -a ./Workbench.app/Workbench --self-test

      # The Workbench as an AppImage: the app, the library, FreeCoreData and
      # the GNUstep runtime in one file (Scripts/prepare-appdir.sh,
      # Scripts/package-appimage.sh). A v* tag attaches it to that release.
      - name: Package the Workbench as an AppImage
        run: |
          sudo apt-get -q -y install desktop-file-utils fonts-dejavu fonts-liberation
          ./Scripts/install-linuxdeploy.sh
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-$GITHUB_RUN_NUMBER"
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          GNUSTEP_PREFIX="$PREFIX" ./Scripts/prepare-appdir.sh
          APP_VERSION="$version" GNUSTEP_PREFIX="$PREFIX" ./Scripts/package-appimage.sh

      # Where it will run: a plain Ubuntu with no GNUstep, and only the
      # libraries every desktop has (AppImage leaves those to the host). The
      # offline self-test drives the window against the built-in service.
      # The host's fonts are removed first (libfontconfig1 pulls in DejaVu),
      # so the window lays out with the fonts the image carries or not at
      # all: a font path that misses them fails here.
      - name: Smoke-test the AppImage on a clean system
        run: |
          image=$(ls ODataWorkbench-Linux-*.AppImage)
          chmod +x "$image"
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            export DEBIAN_FRONTEND=noninteractive
            for i in 1 2 3; do
              apt-get update -qq && apt-get install -y -qq --fix-missing xvfb xauth ca-certificates \
                libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libxcb1 libgl1 libharfbuzz0b > /dev/null && break
              sleep 10
            done
            rm -rf /usr/share/fonts
            APPIMAGE_EXTRACT_AND_RUN=1 timeout 300 xvfb-run -a ./'"$image"' --self-test builtin'

      - uses: actions/upload-artifact@v4
        with:
          name: ODataWorkbench-Linux-${{ github.sha }}
          path: ${{ github.workspace }}/source/ODataWorkbench-Linux-*.AppImage
          retention-days: 14

      - name: Attach the AppImage to the release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/source/ODataWorkbench-Linux-*.AppImage
