name: Release

# The Workbench for macOS, signed with a Developer ID and notarized, and
# for a release the appcast its Sparkle reads: ported from FreeCoreData's
# and XFormsKit's release workflows. A v* tag builds it
# and attaches it to that release. Run by hand with a tag, it builds that
# tag and attaches to its release, one published already included (the
# ad hoc zip ci.yml attached before this workflow existed is replaced, the
# name being the same); with none, it builds the branch, as an artifact
# only. The Linux AppImage is ci.yml's.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build, sign and attach to its release (empty: this branch, artifacts only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  macos:
    name: macOS (signed)
    runs-on: macos-15
    timeout-minutes: 60
    # The signing and notarisation secrets live in this environment, and an
    # environment's secrets are only readable by a job that names it: without
    # this line every one of them resolves to the empty string and the job
    # ships an unsigned build, saying so and passing.
    environment: production
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Version
        run: |
          if [ -n "$TAG" ]; then
            echo "APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-build${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      # Release, universal (arm64 and x86_64), the frameworks embedded; it
      # has to start and pass the offline self-test before anything else.
      - name: Build
        run: |
          xcodebuild -workspace ODataKit.xcworkspace -scheme Workbench \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/Release" \
            MARKETING_VERSION="${APP_VERSION%%-*}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          app="$RUNNER_TEMP/Release/Build/Products/Release/Workbench.app"
          echo "APP=$app" >> "$GITHUB_ENV"
          for fw in ODataKit ODataIncrementalStore OTelKit HTTPServerKit ODataService ODataSync Sparkle; do
            test -d "$app/Contents/Frameworks/$fw.framework" \
              || { echo "::error::Workbench.app does not embed $fw.framework"; exit 1; }
          done
          lipo "$app/Contents/MacOS/Workbench" -verify_arch arm64 x86_64
          "$app/Contents/MacOS/Workbench" --self-test builtin

      # Signing, notarizing and the appcast are gnustep-release-actions',
      # the same in every app's release. Each step skips itself, saying so,
      # when its secrets are absent (a fork, a dry run): the build is then
      # unsigned, and named so.
      - name: Sign
        id: sign
        uses: ashalkhakov/gnustep-release-actions/macos-sign@v1
        with:
          app: ${{ env.APP }}
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.MACOS_SIGN_IDENTITY }}

      # The hardened runtime loads only frameworks signed by the same team:
      # the signed app has to start and pass again.
      - name: Self-test, signed
        if: steps.sign.outputs.signed == 'true'
        run: '"$APP/Contents/MacOS/Workbench" --self-test builtin'

      - name: Notarize
        if: steps.sign.outputs.signed == 'true'
        uses: ashalkhakov/gnustep-release-actions/macos-notarize@v1
        with:
          app: ${{ env.APP }}
          apple-id: ${{ secrets.NOTARY_APPLE_ID }}
          team-id: ${{ secrets.NOTARY_TEAM_ID }}
          password: ${{ secrets.NOTARY_PASSWORD }}

      - name: Package
        run: |
          suffix=""
          [ "${{ steps.sign.outputs.signed }}" = "true" ] || suffix="-unsigned"
          ditto -c -k --keepParent "$APP" "ODataWorkbench-macOS-${APP_VERSION}${suffix}.zip"

      # The appcast the Workbench's Sparkle reads (SUFeedURL: the newest
      # release's appcast.xml), signed with the key whose public half is
      # SUPublicEDKey; for a release only.
      - name: Appcast
        if: steps.sign.outputs.signed == 'true'
        uses: ashalkhakov/gnustep-release-actions/sparkle-appcast@v1
        with:
          archive: ${{ github.workspace }}/ODataWorkbench-macOS-${{ env.APP_VERSION }}.zip
          output: ${{ github.workspace }}/appcast.xml
          tag: ${{ env.TAG }}
          private-key: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: ODataWorkbench-macOS-${{ env.APP_VERSION }}
          path: |
            ${{ github.workspace }}/ODataWorkbench-macOS-*.zip
            ${{ github.workspace }}/appcast.xml

      - name: Attach to the release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            ${{ github.workspace }}/ODataWorkbench-macOS-*.zip
            ${{ github.workspace }}/appcast.xml
