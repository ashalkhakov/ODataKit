name: Release

# The Workbench for macOS (signed, notarized, updated by Sparkle) and Linux
# (an AppImage that updates itself), by gnustep-release-actions' release
# workflows, the same as every app's. What is the Workbench's own is in
# .github/release/ (build, test, package); the commits it builds on in
# .github/pins.env.
#
# A v* tag builds both and attaches them to its release (a pre-release when
# the tag has a '-'). Run by hand with a tag, it builds that tag; with none,
# this branch, as artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and attach to its release (empty: this branch, artifacts only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  macos:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/macos-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      apps: ODataWorkbench=Workbench
    secrets: inherit

  appimage:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/appimage-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      appimage: ODataWorkbench-Linux
      dependencies: FreeCoreData
      extra-packages: libsqlite3-dev libpq-dev libmariadb-dev libqrencode-dev
