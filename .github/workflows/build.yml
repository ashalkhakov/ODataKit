name: Build

# ODataKit, built, tested and installed the familiar way (make, make check,
# make install; Makefile.apple on macOS) by gnustep-release-actions'
# workflows, the same as every repository's. Every push builds and tests it
# and uploads what it installs: on Linux the libraries and the server's tools
# as an archive for what builds on them, and the Workbench's AppImage (with
# the Device app and the launcher); on macOS the libraries as XCFrameworks
# (macOS, iOS) and the Workbench; and its images (the SDK, the runtime,
# ois-serve). A v* tag (or a run started by hand with one) also releases
# them: the archives, the AppImage with its update information, the
# Workbench signed and notarized with its Sparkle appcast, attached to the
# tag's release (a pre-release when the tag has a '-'), and the images
# pushed to the GitHub Container Registry. What it builds on is in
# .github/pins.env.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and release (empty: this branch, as artifacts)'
        required: false
        default: ''

# Pushes only: a push to a branch already shows its checks on the branch's
# pull request. A newer push supersedes the run before it; a release is
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  linux:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/linux.yml@v1
    with:
      tag: ${{ inputs.tag }}
      library: true
      extra-packages: libsqlite3-dev libpq-dev libmariadb-dev libqrencode-dev avahi-daemon
      databases: postgres mysql mariadb

  macos:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/macos.yml@v1
    with:
      tag: ${{ inputs.tag }}
      library: true
      apps: ODataWorkbench=Workbench
    secrets: inherit

  docker:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/docker.yml@v1
    with:
      tag: ${{ inputs.tag }}
      dockerfile: Docker/Dockerfile
      images: sdk=odatakit-sdk runtime=odatakit-runtime ois-serve=ois-serve
      description: "ODataKit: OData for Objective-C, on Apple and on GNUstep"
    permissions:
      contents: read
      packages: write
