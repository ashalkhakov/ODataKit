name: Build

# The Workbench on macOS and Linux (an AppImage), and ODataKit's images (the
# SDK, the runtime, ois-serve), by gnustep-release-actions' workflows, the
# same as every app's: every push is built, tested and uploaded as
# artifacts; a v* tag (or a run started by hand with one) is also released:
# the Mac app signed and notarized with its Sparkle appcast, the AppImage
# with its update information, attached to the tag's release (a pre-release
# when the tag has a '-'), and the images pushed to the GitHub Container
# Registry. What is ODataKit's own is in .github/release/ (build, test, the
# image's configuration); the commits it builds on in .github/pins.env.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and release (empty: this branch, as artifacts)'
        required: false
        default: ''

# Pushes only, not pull requests too: a push to a branch of this repository
# already shows its checks on the branch's pull request, and both would run
# every commit twice. A newer push to a branch supersedes the run before it;
# a release is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  macos:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/macos-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      apps: ODataWorkbench=Workbench
    secrets: inherit

  appimage:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/appimage-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      dependencies: FreeCoreData
      extra-packages: libsqlite3-dev libpq-dev libmariadb-dev libqrencode-dev avahi-daemon
      databases: postgres mysql mariadb

  docker:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/docker-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      dockerfile: Docker/Dockerfile
      images: sdk=odatakit-sdk runtime=odatakit-runtime ois-serve=ois-serve
      description: "ODataKit: OData for Objective-C, on Apple and on GNUstep"
    permissions:
      contents: read
      packages: write
