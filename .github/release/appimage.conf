# The Workbench's AppImage: what it carries and starts. The image is gnustep-release-actions'
# appimage (the launcher, the runtime, the fonts), the same as every app's;
# see its appimage.sh for each name.
# Not "-Linux": an .AppImage says what it is for (AppImage asks names not to).
IMAGE=ODataWorkbench
NAME=ODataWorkbench
# Two apps and the launcher that chooses between them.
APPS="ODataLauncher Workbench DeviceDesktop"
DEFAULT=ODataLauncher
#   <image> device|workbench ...      ln -s <image> odata-device
ROUTES="device,devicedesktop,odata-device=DeviceDesktop workbench=Workbench launcher=ODataLauncher"
# Other arguments are the Workbench's, as before there were two apps
# (--self-test, --serve).
WITH_ARGUMENTS=Workbench
ENTRIES="Scripts/appimage/odata.desktop=Examples/Workbench/Workbench.png Scripts/appimage/workbench.desktop=Examples/Workbench/Workbench.png Scripts/appimage/device.desktop=Examples/Workbench/Workbench.png"
# The Workbench's offline self-test, against its built-in service, on a
# clean Ubuntu.
SMOKE="--self-test builtin"
